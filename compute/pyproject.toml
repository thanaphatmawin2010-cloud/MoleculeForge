[project]
name = "moleculeforge-compute"
version = "1.0.0"
description = "MoleculeForge compute sidecar: cheminformatics, force fields, semi-empirical/DFT quantum chemistry, docking and the local AI tool host."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "MoleculeForge contributors" }]
dependencies = [
    "rdkit==2026.9.2",
    "openmm==8.6.1",
    "pyscf==2.15.1",
    "numpy>=2.1,<3",
    "scipy>=1.14,<2",
    "pydantic>=2.10,<3",
    "psutil>=6,<8",
    "reportlab>=4.2,<6",
    "meeko==0.8.0",
    "gemmi>=0.7,<0.8",
    "uharfbuzz>=0.50",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "mypy>=1.13",
    "ruff>=0.8",
    "pyinstaller>=6.11",
]
data = [
    "mendeleev==1.4.0",
]

[project.scripts]
moleculeforge-compute = "mfcompute.server:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mfcompute"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
exclude = ["build/", "dist/"]

[[tool.mypy.overrides]]
module = ["rdkit.*", "openmm.*", "pyscf.*", "scipy.*", "meeko.*", "reportlab.*", "psutil.*", "mendeleev.*", "gemmi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["../tests/unit/compute", "../tests/integration/compute", "../tests/chem-validation"]
timeout = 900
addopts = "-q"
