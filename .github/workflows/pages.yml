name: Web trial (GitHub Pages)

# Builds MoleculeForge Lite (ui/src/lite: the same interface over a WebAssembly engine), tests the
# built site in Chromium at desktop and phone size, and publishes it to GitHub Pages.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["ui/**", "data/**", "tests/e2e-lite/**", "pnpm-lock.yaml", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build MoleculeForge Lite
        run: pnpm --dir ui build:lite
        env:
          # The trial's "Get the desktop app" link.
          VITE_DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/latest
      - run: pnpm --dir ui exec playwright install --with-deps chromium
      - name: Test the built site (desktop and phone, offline, accessibility)
        run: PW_CHROMIUM="" pnpm --dir ui e2e:lite
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui/dist-lite

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
