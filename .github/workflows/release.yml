name: Release installers
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
            bundles: deb,appimage
          - os: windows-2022
            platform: windows-x64
            bundles: msi,nsis
          - os: macos-14
            platform: macos-arm64
            bundles: dmg
          - os: macos-13
            platform: macos-x64
            bundles: dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            cmake spirv-headers libvulkan-dev glslc patchelf
      - name: Windows GPU toolchain (Vulkan SDK for llama.cpp)
        if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@v1.2
        with: { version: 1.4.309.0, cache: true }
      - name: Fetch, build and verify the bundled engines, model and fonts
        shell: bash
        run: python3 scripts/fetch_engines.py --platform ${{ matrix.platform }}
      - name: Frozen compute sidecar
        shell: bash
        run: cd compute && uv sync --all-groups && uv run pyinstaller packaging/moleculeforge-compute.spec --noconfirm
      - name: Licences and installer payload
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          cd compute
          uv run python ../scripts/collect_licenses.py
          uv run python ../scripts/stage_resources.py --platform ${{ matrix.platform }}
      - name: Installers
        shell: bash
        env:
          # Optional code signing; builds are unsigned when these secrets are absent.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: cd app-shell/src-tauri && npx --prefix ../../ui tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: moleculeforge-${{ matrix.platform }}
          path: |
            app-shell/src-tauri/target/release/bundle/**/*.deb
            app-shell/src-tauri/target/release/bundle/**/*.AppImage
            app-shell/src-tauri/target/release/bundle/**/*.msi
            app-shell/src-tauri/target/release/bundle/**/*.exe
            app-shell/src-tauri/target/release/bundle/**/*.dmg
