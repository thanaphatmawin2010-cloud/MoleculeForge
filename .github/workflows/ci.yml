name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir ui typecheck
      - run: pnpm --dir ui lint
      - run: pnpm --dir ui i18n:check
      - run: pnpm --dir ui test
      - run: pnpm --dir ui build

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: mkdir -p ui/dist app-shell/src-tauri/resources && echo '<!doctype html>' > ui/dist/index.html
      - run: cargo test --manifest-path app-shell/src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path app-shell/src-tauri/Cargo.toml -- -D warnings

  compute:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y cmake spirv-headers libvulkan-dev glslc
      - uses: actions/cache@v4
        with:
          path: |
            engines
            data/models
            data/fonts
          key: engines-${{ runner.os }}-${{ hashFiles('scripts/engines.lock.json') }}
      - run: python3 scripts/fetch_engines.py
      - run: cd compute && uv sync --all-groups
      - run: cd compute && uv run ruff check mfcompute ../scripts
      - run: cd compute && uv run pytest -m "not slow"
      - run: cd compute && uv run pytest -m slow
      - run: compute/.venv/bin/python scripts/validation_report.py

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: [ui, compute]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: |
            engines
            data/models
            data/fonts
          key: engines-${{ runner.os }}-${{ hashFiles('scripts/engines.lock.json') }}
      - run: sudo apt-get update && sudo apt-get install -y cmake spirv-headers libvulkan-dev glslc
      - run: python3 scripts/fetch_engines.py
      - run: pnpm install --frozen-lockfile && cd compute && uv sync
      - run: pnpm --dir ui exec playwright install --with-deps chromium
      - run: PW_CHROMIUM="" pnpm --dir ui e2e

  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: OSV-Scanner (fails on any advisory not justified in osv-scanner.toml)
        run: |
          curl -sSL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.2.4/osv-scanner_linux_amd64
          chmod +x osv-scanner
          ./osv-scanner scan source --config osv-scanner.toml \
            --lockfile compute/uv.lock --lockfile pnpm-lock.yaml --lockfile app-shell/src-tauri/Cargo.lock
