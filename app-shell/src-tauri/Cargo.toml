[package]
name = "moleculeforge"
version = "1.0.0"
description = "MoleculeForge: offline molecular building, validation and simulation"
authors = ["MoleculeForge contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "moleculeforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.12", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
